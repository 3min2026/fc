<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>快捷命令</title>

<script src="./sql-wasm.js"></script>

<!-- 尽早判断设备 -->
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var isMobile =
      /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|CriOS|FxiOS|HarmonyOS/i.test(ua) ||
      /iPad/.test(ua) ||
      (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
    document.documentElement.classList.add(isMobile ? 'is-mobile' : 'is-desktop');
  })();
</script>

<style>
  /* ============================================================
     1. 深色主题变量（取自 asd.html）
     ============================================================ */
  :root {
    --bg: #0b1220;
    --surface: #1e293b;
    --text: #f1f5f9;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --primary: #60a5fa;
    --primary-hover: #3b82f6;
    --border: #334155;
    --shadow: 0 10px 25px -5px rgb(0 0 0 / .5);

    --font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                 Consolas, "Liberation Mono", monospace;

    --radius: 14px;
    --radius-sm: 9px;

    color-scheme: dark;
  }

  /* ============================================================
     2. 基础重置
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-family);
    font-size: 16px;
    line-height: 1.6;
    overflow-wrap: break-word;
  }

  .container { width: 96%; max-width: 1920px; margin: 0 auto; }

  h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.25; color: var(--text); }
  h1 { font-size: 1.5rem; }
  h3 { font-size: 1.05rem; }
  p { margin: 0 0 1rem; }
  small { color: var(--text-muted); }

  a { color: var(--primary); text-decoration: none; transition: color .2s ease; }
  a:hover { color: var(--primary-hover); }

  code {
    padding: .12rem .4rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #0f1729;
    color: var(--text-soft);
    font-family: var(--font-mono);
    font-size: .85em;
  }

  .page-header { margin-bottom: 1.25rem; }
  .page-header .subtitle {
    margin: .3rem 0 0;
    color: var(--text-muted);
    font-size: .875rem;
  }

  /* ============================================================
     3. 导航
     ============================================================ */
  nav { margin-bottom: 1rem; }
  nav ul {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  nav a {
    display: inline-block;
    padding: .48rem .95rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: .9rem;
    text-decoration: none;
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  nav a:hover { color: var(--text); border-color: var(--primary); }
  nav a.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #0b1220;
    font-weight: 600;
  }

  /* ============================================================
     4. 表单控件
     ============================================================ */
  input, select, textarea, button { font-family: inherit; font-size: .9rem; }

  input[type="search"],
  input[type="text"],
  select,
  textarea {
    -webkit-appearance: none;
    appearance: none;
    padding: .55rem .85rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background-color: #0f1729;
    color: var(--text);
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  input[type="search"]::placeholder,
  input[type="text"]::placeholder,
  textarea::placeholder { color: var(--text-muted); opacity: 1; }

  input[type="search"]:focus,
  input[type="text"]:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(96, 165, 250, .18);
  }

  /* 下拉框箭头 */
  select {
    padding-right: 2.1rem;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position:
      calc(100% - 1.05rem) calc(50% + 1px),
      calc(100% - .7rem)  calc(50% + 1px);
    background-size: .32rem .32rem, .32rem .32rem;
    background-repeat: no-repeat;
    cursor: pointer;
  }
  select::-ms-expand { display: none; }

  button {
    -webkit-appearance: none;
    appearance: none;
    padding: .55rem .95rem;
    border: 1px solid var(--primary);
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #0b1220;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease,
                color .2s ease, box-shadow .2s ease;
  }
  button:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(96, 165, 250, .3); }

  button.outline {
    background: transparent;
    color: var(--primary);
    border-color: var(--border);
  }
  button.outline:hover {
    background: rgba(96, 165, 250, .1);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* ============================================================
     5. 工具栏
     ============================================================ */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem;
    margin-bottom: .85rem;
  }
  .toolbar .search-wrapper { flex: 1 1 240px; min-width: 0; }
  .toolbar .search-wrapper input { width: 100%; }
  .toolbar select { flex: 0 0 auto; width: auto; min-width: 108px; }
  .toolbar button { flex: 0 0 auto; }

  .list-count {
    margin-bottom: .6rem;
    color: var(--text-muted);
    font-size: .82rem;
  }

  /* ============================================================
     6. 命令表格
     ============================================================ */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .cmd-table { width: 100%; border-collapse: collapse; font-size: .875rem; }

  .cmd-table th,
  .cmd-table td {
    padding: .6rem .75rem;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--border);
  }

  .cmd-table thead th {
    background: rgba(255, 255, 255, .03);
    color: var(--text-muted);
    font-size: .78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .cmd-table tbody tr:last-child td { border-bottom: none; }
  .cmd-table tbody tr:hover { background: rgba(255, 255, 255, .025); }

  /* 列宽：描述列加宽 */
  .cmd-table .col-id       { width: 52px;  color: var(--text-muted); font-size: .78rem; }
  .cmd-table .col-cmd      { min-width: 240px; }
  .cmd-table .col-desc     { width: 28%; min-width: 200px; }
  .cmd-table .col-platform { width: 96px; }
  .cmd-table .col-cat      { width: 104px; }
  .cmd-table .col-shell    { width: 84px; }
  .cmd-table .col-act      { width: 64px; }

  /* 命令本体：最多两行 */
  .cmd-text {
    font-family: var(--font-mono);
    font-size: .8rem;
    line-height: 1.5;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 描述：最多两行 */
  .cmd-desc {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: .84rem;
    line-height: 1.5;
    color: var(--text-soft);
  }

  .cmd-text.shell-powershell { color: #8EC449; }
  .cmd-text.shell-cmd        { color: #E2E8F0; }
  .cmd-text.shell-bash       { color: #FF82FC; }
  .cmd-text.shell-linux      { color: #E0D846; }
  .cmd-text.shell-windows    { color: #00E6FF; }

  /* ============================================================
     7. 徽章
     ============================================================ */
  .badge {
    display: inline-block;
    padding: .12rem .45rem;
    border-radius: 999px;
    font-size: .72rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-parent { background: rgba(96, 165, 250, .16);  color: #93c5fd; }
  .badge-child  { background: rgba(244, 114, 182, .16); color: #f9a8d4; }

  .badge-shell-powershell { background: rgba(74, 222, 128, .16);  color: #86efac; }
  .badge-shell-cmd        { background: rgba(148, 163, 184, .18); color: #cbd5e1; }
  .badge-shell-bash       { background: rgba(251, 146, 60, .16);  color: #fdba74; }
  .badge-shell-linux      { background: rgba(192, 132, 252, .16); color: #d8b4fe; }
  .badge-shell-windows    { background: rgba(56, 189, 248, .16);  color: #7dd3fc; }
  .badge-shell-all    { background: rgba(56, 189, 248, .16);  color: #F5DA6E; }

  .badge-script-python     { background: rgba(56, 189, 248, .16);  color: #7dd3fc; }
  .badge-script-powershell { background: rgba(74, 222, 128, .16);  color: #86efac; }
  .badge-script-bat        { background: rgba(250, 204, 21, .16);  color: #fde047; }
  .badge-script-vbs        { background: rgba(244, 114, 182, .16); color: #f9a8d4; }
  .badge-script-shell      { background: rgba(192, 132, 252, .16); color: #d8b4fe; }
  .badge-script-default    { background: rgba(148, 163, 184, .18); color: #cbd5e1; }
  .badge-platform          { background: rgba(56, 189, 248, .12);  color: #7dd3fc; margin-left: .3rem; }

  .btn-copy { padding: .25rem .6rem; font-size: .75rem; }

  /* ============================================================
     8. 软件 / 脚本卡片
     ============================================================ */
  .sw-category { margin-bottom: 1.6rem; }
  .sw-category > h3 {
    margin-bottom: .7rem;
    padding-bottom: .4rem;
    border-bottom: 2px solid var(--primary);
    font-size: 1rem;
  }
  .sw-category > h3 small { font-weight: 400; font-size: .78rem; }

  .sw-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: .75rem;
  }

  .sw-card {
    display: flex;
    flex-direction: column;
    gap: .3rem;
    padding: .85rem .95rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .sw-card:hover { border-color: var(--primary); }

  .sw-card .sw-name { font-weight: 700; font-size: .93rem; line-height: 1.35; }
  .sw-card .sw-desc { flex: 1; font-size: .78rem; line-height: 1.45; color: var(--text-muted); }
  .sw-card .sw-platform { font-size: .74rem; font-weight: 600; color: var(--primary); }

  .sw-card .sw-actions { display: flex; gap: .4rem; margin-top: .35rem; }
  .sw-card .sw-actions a,
  .sw-card .sw-actions button {
    flex: 1;
    padding: .35rem .4rem;
    border: 1px solid transparent;
    border-radius: 7px;
    font-size: .78rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }

  .sw-btn-open,
  .sw-btn-download { background: var(--primary); color: #0b1220; }
  .sw-btn-open:hover,
  .sw-btn-download:hover { background: var(--primary-hover); color: #0b1220; }

  .sw-btn-copy {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
    font-weight: 500;
  }
  .sw-btn-copy:hover {
    background: rgba(96, 165, 250, .1);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* ============================================================
     9. 状态 / 提示
     ============================================================ */
  .loading,
  .empty-tip {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--text-muted);
    font-size: .9rem;
  }
  .empty-tip { padding: 2rem 1rem; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(1.2rem + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: 90vw;
    padding: .6rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: .85rem;
    text-align: center;
    box-shadow: var(--shadow);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .toast.show { opacity: 1; }

  /* ============================================================
     10. 移动端（仅 html.is-mobile 生效）
     ============================================================ */
  html.is-mobile body {
    padding: 18px 12px calc(24px + env(safe-area-inset-bottom));
  }
  html.is-mobile .container { max-width: 100%; }
  html.is-mobile h1 { font-size: 1.3rem; }
  html.is-mobile .page-header { margin-bottom: 1rem; }

  html.is-mobile .toolbar { gap: .4rem; margin-bottom: .6rem; }
  html.is-mobile .toolbar .search-wrapper { flex: 1 1 100%; }
  html.is-mobile .toolbar select {
    flex: 1 1 calc(50% - .2rem);
    width: auto;
    min-width: 0;
    font-size: .85rem;
  }
  html.is-mobile .toolbar button {
    flex: 1 1 calc(50% - .2rem);
    font-size: .85rem;
    padding: .5rem .4rem;
  }

  /* 命令表 —— 卡片式单列 */
  html.is-mobile .table-wrap {
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
  }
  html.is-mobile .cmd-table { display: block; font-size: .85rem; }
  html.is-mobile .cmd-table thead { display: none; }
  html.is-mobile .cmd-table tbody { display: block; }
  html.is-mobile .cmd-table tr {
    display: block;
    margin-bottom: .55rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  html.is-mobile .cmd-table tr:hover { background: var(--surface); }
  html.is-mobile .cmd-table td,
  html.is-mobile .cmd-table td.m-row {
    display: block;
    width: 100%;
    padding: .7rem .75rem;
    border-bottom: none;
  }

  html.is-mobile .m-desc {
    margin-top: .3rem;
    font-size: .76rem;
    line-height: 1.45;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  html.is-mobile .m-meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .3rem;
    margin-top: .45rem;
  }
  html.is-mobile .m-meta-row .badge { font-size: .62rem; padding: .1rem .35rem; }
  html.is-mobile .m-meta-row .btn-copy {
    margin-left: auto;
    font-size: .68rem;
    padding: .2rem .5rem;
  }

  /* 卡片 —— 一行两个 */
  html.is-mobile .sw-category { margin-bottom: 1rem; }
  html.is-mobile .sw-category > h3 { font-size: .95rem; margin-bottom: .5rem; }
  html.is-mobile .sw-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .5rem;
  }
  html.is-mobile .sw-card { padding: .6rem .65rem; border-radius: 10px; gap: .2rem; }
  html.is-mobile .sw-card .sw-name { font-size: .85rem; }
  html.is-mobile .sw-card .sw-desc { font-size: .7rem; line-height: 1.35; }
  html.is-mobile .sw-card .sw-platform { font-size: .68rem; }
  html.is-mobile .sw-card .sw-actions a,
  html.is-mobile .sw-card .sw-actions button {
    font-size: .7rem;
    padding: .3rem .25rem;
  }
  html.is-mobile .list-count { font-size: .78rem; }
</style>
</head>
<body>

<main class="container">

  <header class="page-header">
    <h1>快捷命令</h1>
    <p class="subtitle">命令速查 · 软件链接 · 脚本工具</p>
  </header>

  <div id="loading" class="loading">
    <p>正在加载数据库…</p>
  </div>

  <div id="app" style="display:none;">

    <nav>
      <ul>
        <li><a href="#" id="tab-cmd" class="active" onclick="switchTab('cmd');return false;">命令速查</a></li>
        <li><a href="#" id="tab-sw" onclick="switchTab('sw');return false;">软件链接</a></li>
        <li><a href="#" id="tab-script" onclick="switchTab('script');return false;">脚本工具</a></li>
      </ul>
    </nav>

    <!-- ============ 命令速查 ============ -->
    <section id="section-cmd">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="cmd-keyword"
                 placeholder="按描述 / 关键字搜索命令…"
                 oninput="filterCommands()">
        </div>
        <select id="cmd-parent" onchange="onParentChange()">
          <option value="">全部平台</option>
        </select>
        <select id="cmd-child" onchange="filterCommands()">
          <option value="">全部分类</option>
        </select>
        <select id="cmd-shell" onchange="filterCommands()">
          <option value="">全部 Shell</option>
          <option value="CMD">CMD</option>
          <option value="PowerShell">PowerShell</option>
          <option value="Bash">Bash</option>
          <option value="Linux">Linux</option>
          <option value="Windows">Windows</option>
        </select>
        <button class="outline" onclick="resetCmdFilters()">重置</button>
      </div>

      <div id="cmd-count" class="list-count"></div>

      <div class="table-wrap">
        <table class="cmd-table">
          <thead>
            <tr>
              <th class="col-id">ID</th>
              <th class="col-cmd">命令</th>
              <th class="col-desc hide-mobile">描述</th>
              <th class="col-platform hide-mobile">平台</th>
              <th class="col-cat">分类</th>
              <th class="col-shell">Shell</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="cmd-tbody"></tbody>
        </table>
      </div>
      <div id="cmd-empty" class="empty-tip" style="display:none;">没有匹配的命令</div>
    </section>

    <!-- ============ 软件链接 ============ -->
    <section id="section-sw" style="display:none;">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="sw-keyword"
                 placeholder="搜索软件名 / 描述 / 链接…"
                 oninput="filterSoftware()">
        </div>
        <select id="sw-platform" onchange="filterSoftware()">
          <option value="">全部平台</option>
        </select>
        <button class="outline" onclick="resetSwFilters()">重置</button>
      </div>

      <div id="sw-count" class="list-count"></div>
      <div id="sw-content"></div>
      <div id="sw-empty" class="empty-tip" style="display:none;">没有匹配的软件</div>
    </section>

    <!-- ============ 脚本工具 ============ -->
    <section id="section-script" style="display:none;">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="script-keyword"
                 placeholder="搜索脚本名 / 描述 / 依赖 / 关键字 / 平台…"
                 oninput="filterScripts()">
        </div>
        <select id="script-category" onchange="filterScripts()">
          <option value="">全部分类</option>
        </select>
        <select id="script-type" onchange="filterScripts()">
          <option value="">全部类型</option>
        </select>
        <select id="script-platform" onchange="filterScripts()">
          <option value="">全部平台</option>
        </select>
        <button class="outline" onclick="resetScriptFilters()">重置</button>
      </div>

      <div id="script-count" class="list-count"></div>
      <div id="script-content"></div>
      <div id="script-empty" class="empty-tip" style="display:none;">没有匹配的脚本</div>
    </section>

  </div>
</main>

<div id="toast" class="toast"></div>

<script>
// ==================== 全局 ====================
let db = null;
let allCommands = [];
let allSoftware = [];
let allScripts = [];

const DB_FILE = 'commands.db';
const IS_MOBILE = document.documentElement.classList.contains('is-mobile');

// ==================== 工具函数 ====================
function $(id) { return document.getElementById(id); }

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制'); }
    catch (e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ==================== 下载脚本 ====================
function downloadScript(id) {
  const script = allScripts.find(s => s.id === id);
  if (!script) return;

  const extMap = {
    'Python':     '.py',
    'PowerShell': '.ps1',
    'bat':        '.bat',
    'vbs':        '.vbs',
    'Shell':      '.sh'
  };
  const ext = extMap[script.script_type] || '.txt';
  const filename = script.name + ext;

  let content = script.content == null ? '' : String(script.content);

  const useCRLF = ['.ps1', '.bat', '.cmd', '.vbs', '.py'].includes(ext);
  content = content.replace(/\r\n|\r|\n/g, useCRLF ? '\r\n' : '\n');

  if (content.charCodeAt(0) === 0xFEFF) {
    content = content.slice(1);
  }

  if (ext === '.ps1') {
    content = '\uFEFF' + content;
  }

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('下载已开始: ' + filename);
}

// ==================== 加载数据库 ====================
async function loadDatabase() {
  try {
    const SQL = await initSqlJs({ locateFile: file => './' + file });

    const resp = await fetch(DB_FILE);
    if (!resp.ok) throw new Error('无法加载 ' + DB_FILE + '（HTTP ' + resp.status + '）');
    const buffer = await resp.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buffer));

    const cmdRes = db.exec(
      "SELECT id, command_text, description, keywords, " +
      "parent_category, child_category, shell FROM command_item " +
      "ORDER BY parent_category, child_category, id"
    );
    allCommands = rowsToObjects(cmdRes, [
      'id','command_text','description','keywords',
      'parent_category','child_category','shell'
    ]);

    const swRes = db.exec(
      "SELECT id, name, url, description, category, platform " +
      "FROM software_item ORDER BY category, platform, name"
    );
    allSoftware = rowsToObjects(swRes, [
      'id','name','url','description','category','platform'
    ]);

    const scriptRes = db.exec(
      "SELECT id, name, category, script_type, content, description, dependencies, keywords, platform " +
      "FROM script_item ORDER BY category, script_type, id"
    );
    allScripts = rowsToObjects(scriptRes, [
      'id','name','category','script_type','content','description','dependencies','keywords','platform'
    ]);

    $('loading').style.display = 'none';
    $('app').style.display = 'block';

    buildCmdFilters();
    renderCommands();
    buildSwFilters();
    renderSoftware();
    buildScriptFilters();
    renderScripts();

  } catch (e) {
    $('loading').innerHTML =
      '<p style="color:#f87171;">数据库加载失败</p>' +
      '<p style="font-size:0.85rem;">' + escapeHtml(e.message) + '</p>' +
      '<p style="font-size:0.85rem;">请确认 <code>' + DB_FILE +
      '</code> 和 <code>sql-wasm.wasm</code> 与 HTML 在同一目录，并通过 HTTP 访问（不要直接双击打开 HTML）。</p>';
  }
}

function rowsToObjects(result, fields) {
  if (!result || result.length === 0) return [];
  return result[0].values.map(row => {
    const obj = {};
    fields.forEach((f, i) => { obj[f] = row[i]; });
    return obj;
  });
}

// ==================== Tab 切换 ====================
function switchTab(tab) {
  $('section-cmd').style.display    = tab === 'cmd'    ? '' : 'none';
  $('section-sw').style.display     = tab === 'sw'     ? '' : 'none';
  $('section-script').style.display = tab === 'script' ? '' : 'none';
  $('tab-cmd').classList.toggle('active',    tab === 'cmd');
  $('tab-sw').classList.toggle('active',     tab === 'sw');
  $('tab-script').classList.toggle('active', tab === 'script');
}

// ==================== 命令速查 ====================
function buildCmdFilters() {
  const parents = [...new Set(allCommands.map(c => c.parent_category).filter(Boolean))].sort();
  const childMap = {};
  allCommands.forEach(c => {
    if (!c.parent_category || !c.child_category) return;
    if (!childMap[c.parent_category]) childMap[c.parent_category] = new Set();
    childMap[c.parent_category].add(c.child_category);
  });

  const pSel = $('cmd-parent');
  parents.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    pSel.appendChild(o);
  });

  pSel._childMap = childMap;
}

function onParentChange() {
  const parent = $('cmd-parent').value;
  const childSel = $('cmd-child');
  childSel.innerHTML = '<option value="">全部分类</option>';

  const map = $('cmd-parent')._childMap || {};
  let children = [];
  if (parent) {
    children = map[parent] ? [...map[parent]].sort() : [];
  } else {
    const set = new Set();
    Object.values(map).forEach(s => s.forEach(c => set.add(c)));
    children = [...set].sort();
  }

  children.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    childSel.appendChild(o);
  });

  filterCommands();
}

function filterCommands() {
  const kw     = $('cmd-keyword').value.trim().toLowerCase();
  const parent = $('cmd-parent').value;
  const child  = $('cmd-child').value;
  const shell  = $('cmd-shell').value;

  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allCommands.filter(c => {
    if (parent && c.parent_category !== parent) return false;
    if (child  && c.child_category  !== child)  return false;
    if (shell  && c.shell           !== shell)  return false;

    if (terms.length) {
      /* 只搜索「描述」与「关键字」，不包含命令本体和分类 */
      const haystack = [c.description, c.keywords].join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderCommands(filtered);
}

function renderCommands(list) {
  if (!list) list = allCommands;
  const tbody = $('cmd-tbody');
  tbody.innerHTML = '';

  const empty = $('cmd-empty');
  const count = $('cmd-count');

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 条命令`;

  list.forEach(c => {
    const tr = document.createElement('tr');

    const rawShell  = (c.shell || 'CMD').toLowerCase();
    const safeShell = rawShell.replace(/[^a-z0-9]/g, '');
    const shellClass = `shell-${safeShell}`;
    const badgeClass = `badge-shell-${safeShell}`;
    const cmdJsonSafe = JSON.stringify(c.command_text).replace(/"/g, '&quot;');

    if (IS_MOBILE) {
      tr.innerHTML =
        `<td colspan="7" class="m-row">
           <div class="m-cmd-block">
             <div class="cmd-text ${shellClass}">${escapeHtml(c.command_text)}</div>
             <div class="m-desc">${escapeHtml(c.description || '—')}</div>
             <div class="m-meta-row">
               <span class="badge badge-parent">${escapeHtml(c.parent_category || '—')}</span>
               <span class="badge badge-child">${escapeHtml(c.child_category || '—')}</span>
               <span class="badge ${badgeClass}">${escapeHtml(c.shell || 'CMD')}</span>
               <button class="btn-copy outline" onclick="copyText(${cmdJsonSafe})">复制</button>
             </div>
           </div>
         </td>`;
    } else {
      tr.innerHTML =
        `<td class="col-id">${c.id}</td>` +
        `<td class="col-cmd"><div class="cmd-text ${shellClass}">${escapeHtml(c.command_text)}</div></td>` +
        `<td class="col-desc hide-mobile"><div class="cmd-desc">${escapeHtml(c.description || '—')}</div></td>` +
        `<td class="col-platform hide-mobile"><span class="badge badge-parent">${escapeHtml(c.parent_category || '—')}</span></td>` +
        `<td class="col-cat"><span class="badge badge-child">${escapeHtml(c.child_category || '—')}</span></td>` +
        `<td class="col-shell"><span class="badge ${badgeClass}">${escapeHtml(c.shell || 'CMD')}</span></td>` +
        `<td class="col-act"><button class="btn-copy outline" onclick="copyText(${cmdJsonSafe})">复制</button></td>`;
    }

    tbody.appendChild(tr);
  });
}

function resetCmdFilters() {
  $('cmd-keyword').value = '';
  $('cmd-parent').value = '';
  $('cmd-child').innerHTML = '<option value="">全部分类</option>';
  $('cmd-shell').value = '';
  renderCommands();
}

// ==================== 软件链接 ====================
function buildSwFilters() {
  const platforms = [...new Set(allSoftware.map(s => s.platform).filter(Boolean))].sort();
  const sel = $('sw-platform');
  platforms.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
}

function filterSoftware() {
  const kw = $('sw-keyword').value.trim().toLowerCase();
  const platform = $('sw-platform').value;
  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allSoftware.filter(s => {
    if (platform && s.platform !== platform) return false;
    if (terms.length) {
      const haystack = [s.name, s.url, s.description, s.category, s.platform]
        .join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderSoftware(filtered);
}

function renderSoftware(list) {
  if (!list) list = allSoftware;
  const container = $('sw-content');
  const empty = $('sw-empty');
  const count = $('sw-count');
  container.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 个软件`;

  const groups = {};
  list.forEach(s => {
    const cat = s.category || '未分类';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  Object.keys(groups).sort().forEach(cat => {
    const div = document.createElement('div');
    div.className = 'sw-category';
    div.innerHTML = `<h3>${escapeHtml(cat)} <small>(${groups[cat].length})</small></h3>`;

    const grid = document.createElement('div');
    grid.className = 'sw-grid';

    groups[cat].forEach(s => {
      const card = document.createElement('div');
      card.className = 'sw-card';

      const urlSafe = escapeHtml(s.url);
      const nameSafe = escapeHtml(s.name);

      card.innerHTML =
        `<div class="sw-name">${nameSafe}</div>` +
        (s.platform ? `<div class="sw-platform">${escapeHtml(s.platform)}</div>` : '') +
        (s.description ? `<div class="sw-desc">${escapeHtml(s.description)}</div>` : '') +
        `<div class="sw-actions">` +
        `<a class="sw-btn-open" href="${urlSafe}" target="_blank" rel="noopener">打开</a>` +
        `<button class="sw-btn-copy" onclick="copyText(${JSON.stringify(s.url).replace(/"/g, '&quot;')})">复制</button>` +
        `</div>`;

      grid.appendChild(card);
    });

    div.appendChild(grid);
    container.appendChild(div);
  });
}

function resetSwFilters() {
  $('sw-keyword').value = '';
  $('sw-platform').value = '';
  renderSoftware();
}

// ==================== 脚本工具 ====================
function buildScriptFilters() {
  const cats = [...new Set(allScripts.map(s => s.category).filter(Boolean))].sort();
  const catSel = $('script-category');
  catSel.innerHTML = '<option value="">全部分类</option>';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });

  const types = [...new Set(allScripts.map(s => s.script_type).filter(Boolean))].sort();
  const typeSel = $('script-type');
  typeSel.innerHTML = '<option value="">全部类型</option>';
  types.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    typeSel.appendChild(o);
  });

  const plats = [...new Set(allScripts.map(s => s.platform).filter(Boolean))].sort();
  const platSel = $('script-platform');
  platSel.innerHTML = '<option value="">全部平台</option>';
  plats.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    platSel.appendChild(o);
  });
}

function filterScripts() {
  const kw = $('script-keyword').value.trim().toLowerCase();
  const cat = $('script-category').value;
  const sType = $('script-type').value;
  const platform = $('script-platform').value;
  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allScripts.filter(s => {
    if (cat && s.category !== cat) return false;
    if (sType && s.script_type !== sType) return false;
    if (platform && s.platform !== platform) return false;
    if (terms.length) {
      const haystack = [
        s.name, s.category, s.script_type, s.description,
        s.dependencies, s.keywords, s.platform
      ].join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderScripts(filtered);
}

function renderScripts(list) {
  if (!list) list = allScripts;
  const container = $('script-content');
  const empty = $('script-empty');
  const count = $('script-count');
  container.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 个脚本`;

  const groups = {};
  list.forEach(s => {
    const cat = s.category || '未分类';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  Object.keys(groups).sort().forEach(cat => {
    const div = document.createElement('div');
    div.className = 'sw-category';
    div.innerHTML = `<h3>${escapeHtml(cat)} <small>(${groups[cat].length})</small></h3>`;

    const grid = document.createElement('div');
    grid.className = 'sw-grid';

    groups[cat].forEach(s => {
      const card = document.createElement('div');
      card.className = 'sw-card';

      const safeType = (s.script_type || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const badgeClass = `badge-script-${safeType || 'default'}`;

      let badgeHtml = `<span class="badge ${badgeClass}">${escapeHtml(s.script_type || '未知')}</span>`;
      if (s.platform) {
        badgeHtml += `<span class="badge badge-platform">${escapeHtml(s.platform)}</span>`;
      }

      let depHtml = '';
      if (s.dependencies) {
        const escapedDeps = escapeHtml(s.dependencies);
        const jsonDeps = JSON.stringify(s.dependencies).replace(/"/g, '&quot;');
        depHtml = `
          <div class="sw-desc" style="color:#fbbf24; font-size:.75rem; display:flex; align-items:center; justify-content:space-between; margin-top:.2rem;">
            <span style="word-break:break-all;">依赖: ${escapedDeps}</span>
            <button class="btn-copy outline" style="padding:.1rem .4rem; font-size:.7rem; margin-left:.5rem; white-space:nowrap;" onclick="copyText(${jsonDeps})">复制</button>
          </div>`;
      }

      card.innerHTML =
        `<div class="sw-name">${escapeHtml(s.name)}</div>` +
        `<div style="margin-bottom:.2rem;">${badgeHtml}</div>` +
        depHtml +
        (s.description ? `<div class="sw-desc">${escapeHtml(s.description)}</div>` : '') +
        `<div class="sw-actions">` +
        `<button class="sw-btn-download" onclick="downloadScript(${s.id})">下载脚本</button>` +
        `</div>`;

      grid.appendChild(card);
    });

    div.appendChild(grid);
    container.appendChild(div);
  });
}

function resetScriptFilters() {
  $('script-keyword').value = '';
  $('script-category').value = '';
  $('script-type').value = '';
  $('script-platform').value = '';
  renderScripts();
}

// ==================== 启动 ====================
loadDatabase();
</script>
