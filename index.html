<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>快捷命令</title>

  <script src="./sql-wasm.js"></script>

  <!-- 尽早判断设备 -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile =
        /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|CriOS|FxiOS|HarmonyOS/i.test(ua) ||
        /iPad/.test(ua) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
      document.documentElement.classList.add(isMobile ? 'is-mobile' : 'is-desktop');
    })();
  </script>

  <style>
    /* =========================================================
       ============  基础重置 + 深色主题变量  ============
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --pico-font-size: 95%;

      --pico-font-family-emoji: "Apple Color Emoji", "Segoe UI Emoji",
                                "Segoe UI Symbol", "Noto Color Emoji";
      --pico-font-family-sans-serif: system-ui, "Segoe UI", Roboto, Oxygen, Ubuntu,
                                     Cantarell, Helvetica, Arial, "Helvetica Neue",
                                     sans-serif, var(--pico-font-family-emoji);
      --pico-font-family-monospace: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                                    Consolas, "Liberation Mono", monospace,
                                    var(--pico-font-family-emoji);
      --pico-font-family: var(--pico-font-family-sans-serif);
      --pico-line-height: 1.5;

      --pico-spacing: 1rem;
      --pico-border-radius: 0.25rem;
      --pico-border-width: 0.0625rem;
      --pico-transition: 0.2s ease-in-out;

      --pico-background-color: #131720;
      --pico-color: #c2c7d0;
      --pico-muted-color: #7b8495;
      --pico-muted-border-color: #202632;

      --pico-primary: #01aaff;
      --pico-primary-background: #0172ad;
      --pico-primary-border: #0172ad;
      --pico-primary-hover: #79c0ff;
      --pico-primary-hover-background: #017fc0;
      --pico-primary-hover-border: #017fc0;
      --pico-primary-inverse: #fff;
      --pico-primary-focus: rgba(1, 170, 255, 0.375);

      --pico-card-background-color: #181c25;

      --pico-code-background-color: #1a1f29;
      --pico-code-color: #8891a4;

      --pico-form-element-spacing-vertical: 0.75rem;
      --pico-form-element-spacing-horizontal: 1rem;
      --pico-form-element-background-color: #1c212b;
      --pico-form-element-border-color: #2a3140;
      --pico-form-element-color: #e0e3e7;
      --pico-form-element-placeholder-color: #8891a4;
      --pico-form-element-active-background-color: #1a1f29;
      --pico-form-element-active-border-color: #0172ad;
      --pico-form-element-focus-color: #0172ad;

      --pico-table-border-color: #202632;

      color-scheme: dark;
    }

    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-size: var(--pico-font-size);
      font-family: var(--pico-font-family);
      font-weight: 400;
      line-height: var(--pico-line-height);
      color: var(--pico-color);
      background-color: var(--pico-background-color);
      text-rendering: optimizeLegibility;
      overflow-wrap: break-word;
      tab-size: 4;
    }

    body {
      width: 100%;
      margin: 0;
      color: var(--pico-color);
      background-color: var(--pico-background-color);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
    }

    main { display: block; }
    body > main { padding-block: var(--pico-spacing); }
    section { margin-bottom: var(--pico-spacing); }
    [hidden], template { display: none !important; }

    /* ---- 容器 ---- */
    .container {
      width: 100%;
      margin-right: auto;
      margin-left: auto;
      padding-right: var(--pico-spacing);
      padding-left: var(--pico-spacing);
    }
    @media (min-width: 576px) {
      .container { max-width: 510px; padding-right: 0; padding-left: 0; }
    }
    @media (min-width: 768px)  { .container { max-width: 700px; } }
    @media (min-width: 1024px) { .container { max-width: 950px; } }
    @media (min-width: 1280px) { .container { max-width: 1200px; } }
    @media (min-width: 1536px) { .container { max-width: 1450px; } }

    /* ---- 文字 ---- */
    h1, h2, h3, h4, h5, h6 {
      margin-top: 0;
      margin-bottom: var(--pico-spacing);
      color: var(--pico-color);
      font-weight: 700;
      line-height: 1.2;
    }
    h1 { font-size: 2rem; }
    h2 { font-size: 1.75rem; }
    h3 { font-size: 1.5rem; }
    h4 { font-size: 1.25rem; }
    h5 { font-size: 1.125rem; }
    h6 { font-size: 1rem; }

    p {
      margin-top: 0;
      margin-bottom: var(--pico-spacing);
      color: var(--pico-color);
      font-weight: 400;
    }
    small { font-size: 0.875em; }
    b, strong { font-weight: bolder; }

    hr {
      height: 0;
      margin: var(--pico-spacing) 0;
      border: 0;
      border-top: 1px solid var(--pico-muted-border-color);
    }

    a {
      color: var(--pico-primary);
      text-decoration: underline;
      text-underline-offset: 0.125em;
      transition: color var(--pico-transition);
    }
    a:hover, a:focus { color: var(--pico-primary-hover); }

    code, kbd, pre, samp {
      font-family: var(--pico-font-family-monospace);
      font-size: 0.875em;
      line-height: initial;
      border-radius: var(--pico-border-radius);
      background: var(--pico-code-background-color);
      color: var(--pico-code-color);
    }
    code, kbd, samp { display: inline-block; padding: 0.375rem; }
    pre { display: block; margin-bottom: var(--pico-spacing); overflow-x: auto; }

    /* ---- 导航 ---- */
    nav, nav ul { display: flex; }
    nav { justify-content: space-between; overflow: visible; }
    nav ul { align-items: center; margin-bottom: 0; padding: 0; list-style: none; }
    nav ul:first-of-type { margin-left: -0.5rem; }
    nav ul:last-of-type  { margin-right: -0.5rem; }
    nav li {
      display: inline-block;
      margin: 0;
      padding: 1rem 0.5rem;
      list-style: none;
    }
    nav li a {
      display: inline-block;
      margin: -0.5rem -0.5rem;
      padding: 0.5rem 0.5rem;
      border-radius: var(--pico-border-radius);
      color: var(--pico-primary);
      text-decoration: none;
      transition: color var(--pico-transition), background-color var(--pico-transition);
    }
    nav li a:hover,
    nav li a:focus { color: var(--pico-primary-hover); }
    nav li a.active {
      color: var(--pico-primary);
      background-color: rgba(1, 170, 255, 0.14);
      font-weight: 600;
    }

    /* ---- 表单元素 ---- */
    input, optgroup, select, textarea, button {
      margin: 0;
      font-size: 1rem;
      line-height: var(--pico-line-height);
      font-family: inherit;
      letter-spacing: inherit;
    }

    input:not([type=checkbox],[type=radio],[type=range],[type=file]),
    select,
    textarea {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      padding: var(--pico-form-element-spacing-vertical) var(--pico-form-element-spacing-horizontal);
      border: var(--pico-border-width) solid var(--pico-form-element-border-color);
      border-radius: var(--pico-border-radius);
      outline: 0;
      background-color: var(--pico-form-element-background-color);
      color: var(--pico-form-element-color);
      font-weight: 400;
      transition: background-color var(--pico-transition),
                  border-color var(--pico-transition),
                  box-shadow var(--pico-transition);
    }

    input:not([type=checkbox],[type=radio],[type=range],[type=file]):focus,
    select:focus,
    textarea:focus {
      background-color: var(--pico-form-element-active-background-color);
      border-color: var(--pico-form-element-active-border-color);
      box-shadow: 0 0 0 0.125rem var(--pico-primary-focus);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--pico-form-element-placeholder-color);
      opacity: 1;
    }

    /* 搜索框：圆角 + 纯 CSS 放大镜图标 */
    input[type=search] {
      border-radius: 5rem;
      -webkit-appearance: textfield;
      padding-left: calc(var(--pico-form-element-spacing-horizontal) + 1.75rem);
    }
    input[type=search]::-webkit-search-decoration { -webkit-appearance: none; }

    /* 搜索框包裹层：CSS 绘制放大镜 */
    .search-wrapper {
      position: relative;
      display: block;
      flex: 1 1 200px;
      min-width: 0;
    }
    .search-wrapper::before {
      content: "";
      position: absolute;
      left: calc(var(--pico-form-element-spacing-horizontal) + 0.125rem);
      top: 50%;
      width: 0.7rem;
      height: 0.7rem;
      margin-top: -0.55rem;
      border: 1.5px solid var(--pico-form-element-placeholder-color);
      border-radius: 50%;
      pointer-events: none;
    }
    .search-wrapper::after {
      content: "";
      position: absolute;
      left: calc(var(--pico-form-element-spacing-horizontal) + 0.72rem);
      top: 50%;
      width: 0.42rem;
      height: 0;
      margin-top: 0.22rem;
      border-top: 1.5px solid var(--pico-form-element-placeholder-color);
      transform: rotate(45deg);
      transform-origin: left center;
      pointer-events: none;
    }
    .search-wrapper input[type=search] { width: 100%; margin-bottom: 0; }

    /* 下拉框箭头：纯 CSS 三角 */
    select:not([multiple], [size]) {
      padding-right: calc(var(--pico-form-element-spacing-horizontal) + 1.5rem);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--pico-form-element-placeholder-color) 50%),
        linear-gradient(135deg, var(--pico-form-element-placeholder-color) 50%, transparent 50%);
      background-position:
        calc(100% - 1.05rem) calc(50% + 0.05rem),
        calc(100% - 0.75rem) calc(50% + 0.05rem);
      background-size: 0.3rem 0.3rem, 0.3rem 0.3rem;
      background-repeat: no-repeat;
    }
    select::-ms-expand { display: none; }

    /* ---- 按钮 ---- */
    button,
    [type=button],
    [type=reset],
    [type=submit] {
      -webkit-appearance: none;
      appearance: none;
      display: inline-block;
      padding: var(--pico-form-element-spacing-vertical) var(--pico-form-element-spacing-horizontal);
      border: var(--pico-border-width) solid var(--pico-primary-border);
      border-radius: var(--pico-border-radius);
      outline: 0;
      background-color: var(--pico-primary-background);
      color: var(--pico-primary-inverse);
      font-weight: 400;
      font-size: 1rem;
      line-height: var(--pico-line-height);
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      transition: background-color var(--pico-transition),
                  border-color var(--pico-transition),
                  color var(--pico-transition),
                  box-shadow var(--pico-transition);
    }
    button:hover,
    button:active,
    [type=button]:hover,
    [type=reset]:hover,
    [type=submit]:hover {
      background-color: var(--pico-primary-hover-background);
      border-color: var(--pico-primary-hover-border);
      color: var(--pico-primary-inverse);
    }
    button:focus,
    [type=button]:focus,
    [type=reset]:focus,
    [type=submit]:focus {
      box-shadow: 0 0 0 0.125rem var(--pico-primary-focus);
    }
    button[disabled] { opacity: 0.5; pointer-events: none; }

    button.outline,
    [type=button].outline,
    [type=reset].outline,
    [type=submit].outline {
      background-color: transparent;
      color: var(--pico-primary);
      border-color: var(--pico-primary);
    }
    button.outline:hover,
    button.outline:active,
    button.outline:focus,
    [type=button].outline:hover,
    [type=reset].outline:hover,
    [type=submit].outline:hover {
      background-color: transparent;
      color: var(--pico-primary-hover);
      border-color: var(--pico-primary-hover);
    }

    /* ---- 表格 ---- */
    table {
      width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
      text-indent: 0;
    }
    td, th {
      padding: calc(var(--pico-spacing) / 2) var(--pico-spacing);
      border-bottom: var(--pico-border-width) solid var(--pico-table-border-color);
      background-color: transparent;
      color: var(--pico-color);
      font-weight: 400;
      text-align: left;
    }
    thead td, thead th {
      font-weight: 600;
      border-bottom-width: 0.1875rem;
    }

    /* =========================================================
       ============  桌面端布局  ============
       ========================================================= */
    body { padding-bottom: env(safe-area-inset-bottom); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      align-items: center; margin-bottom: 1rem;
    }
    .toolbar select { flex: 0 0 auto; width: auto; min-width: 100px; margin-bottom: 0; }
    .toolbar button { flex: 0 0 auto; margin-bottom: 0; }

    .cmd-table { width: 100%; font-size: 0.9rem; }
    .cmd-table th, .cmd-table td { padding: 0.5rem 0.6rem; vertical-align: top; }

    .cmd-text {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.85rem; word-break: break-all; white-space: pre-wrap;
    }
    .cmd-text.shell-powershell { color: #8EC449; }
    .cmd-text.shell-cmd        { color: #FFFFFF; }
    .cmd-text.shell-bash       { color: #FF82FC; }
    .cmd-text.shell-linux      { color: #E0D846; }
    .cmd-text.shell-windows    { color: #00E6FF; }

    .badge {
      display: inline-block; padding: 0.15rem 0.45rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; white-space: nowrap;
    }
    .badge-parent { background: #e0e7ff; color: #3730a3; }
    .badge-child  { background: #fce7f3; color: #9d174d; }
    .badge-shell-powershell { background: #ccfbf1; color: #0f766e; }
    .badge-shell-cmd        { background: #e2e8f0; color: #334155; }
    .badge-shell-bash       { background: #ffedd5; color: #9a3412; }
    .badge-shell-linux      { background: #f3e8ff; color: #6b21a8; }
    .badge-shell-windows    { background: #dbeafe; color: #1e40af; }
    .badge-script-python     { background: #dbeafe; color: #1e40af; }
    .badge-script-powershell { background: #ccfbf1; color: #0f766e; }
    .badge-script-bat        { background: #fef3c7; color: #92400e; }
    .badge-script-vbs        { background: #fce7f3; color: #9d174d; }
    .badge-script-shell      { background: #f3e8ff; color: #6b21a8; }
    .badge-script-default    { background: #e2e8f0; color: #334155; }
    .badge-platform { background: #e0f2fe; color: #075985; margin-left: 0.3rem; }

    .btn-copy { padding: 0.2rem 0.6rem; font-size: 0.8rem; margin-bottom: 0; }

    .sw-category { margin-bottom: 1.6rem; }
    .sw-category > h3 {
      margin-bottom: 0.6rem; padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--pico-primary); font-size: 1.05rem;
    }
    .sw-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.7rem;
    }
    .sw-card {
      border: 1px solid var(--pico-muted-border-color); border-radius: 8px;
      padding: 0.75rem 0.85rem; display: flex; flex-direction: column;
      gap: 0.25rem; transition: box-shadow 0.15s;
      background: var(--pico-card-background-color);
    }
    .sw-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .sw-card .sw-name { font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
    .sw-card .sw-desc {
      font-size: 0.8rem; color: var(--pico-muted-color);
      line-height: 1.35; flex: 1;
    }
    .sw-card .sw-platform { font-size: 0.75rem; color: var(--pico-primary); font-weight: 600; }
    .sw-card .sw-actions { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
    .sw-card .sw-actions a,
    .sw-card .sw-actions button {
      flex: 1; text-align: center; padding: 0.3rem 0.4rem; font-size: 0.8rem;
      border-radius: 5px; text-decoration: none; margin-bottom: 0;
      cursor: pointer; border: none;
    }
    .sw-btn-open { background: var(--pico-primary); color: #fff; }
    .sw-btn-copy { background: var(--pico-muted-border-color); color: var(--pico-color); }
    .sw-btn-download { background: #10b981; color: #fff; }

    @media (max-width: 576px) {
      .cmd-table .hide-mobile { display: none; }
      .sw-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.5rem; }
      .sw-card { padding: 0.6rem 0.7rem; }
      .toolbar select { min-width: 80px; font-size: 0.82rem; }
    }

    .empty-tip { text-align: center; padding: 2rem 1rem; color: var(--pico-muted-color); }
    .loading { text-align: center; padding: 3rem 1rem; }

    .toast {
      position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 0.55rem 1.1rem;
      border-radius: 6px; font-size: 0.85rem; z-index: 999;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* =========================================================
       ============  手机端（仅 html.is-mobile 生效） ============
       ========================================================= */
    html.is-mobile {
      --pico-font-size: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html.is-mobile body {
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    }
    html.is-mobile main.container {
      max-width: 100% !important;
      width: 100%;
      padding-left: max(0.4rem, env(safe-area-inset-left));
      padding-right: max(0.4rem, env(safe-area-inset-right));
    }
    html.is-mobile nav ul li a {
      font-size: 0.95rem;
      padding: 0.35rem 0.3rem;
    }

    /* 工具栏 */
    html.is-mobile .toolbar { gap: 0.35rem; margin-bottom: 0.6rem; }
    html.is-mobile .search-wrapper { flex: 1 1 100%; }
    html.is-mobile .toolbar input[type="search"] { font-size: 0.95rem; }
    html.is-mobile .toolbar select {
      flex: 1 1 calc(50% - 0.2rem);
      width: auto; min-width: 0; font-size: 0.85rem;
    }
    html.is-mobile .toolbar button {
      flex: 1 1 calc(50% - 0.2rem);
      font-size: 0.85rem;
      padding: 0.4rem 0.4rem;
    }

    /* ==================== 命令速查：移动端三行堆叠 ==================== */
    html.is-mobile .cmd-table thead { display: none; }
    html.is-mobile .cmd-table { font-size: 0.8rem; border-collapse: collapse; }

    html.is-mobile .cmd-table td.m-row {
      display: table-cell;
      padding: 0.55rem 0.35rem;
    }

    html.is-mobile .m-cmd-block { width: 100%; }
    html.is-mobile .m-cmd-block .cmd-text {
      font-size: 0.82rem;
      line-height: 1.4;
    }

    html.is-mobile .m-desc {
      font-size: 0.7rem;
      color: var(--pico-muted-color);
      line-height: 1.35;
      margin-top: 0.18rem;
      word-break: break-word;
    }

    html.is-mobile .m-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem;
      margin-top: 0.35rem;
    }
    html.is-mobile .m-meta-row .badge {
      font-size: 0.6rem;
      padding: 0.1rem 0.32rem;
    }
    html.is-mobile .m-meta-row .btn-copy {
      font-size: 0.65rem;
      padding: 0.22rem 0.5rem;
      margin-left: auto;
    }

    /* ==================== 卡片：一行 2 个 ==================== */
    html.is-mobile .sw-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.4rem;
    }
    html.is-mobile .sw-card {
      padding: 0.5rem 0.55rem;
      gap: 0.15rem;
    }
    html.is-mobile .sw-category { margin-bottom: 1rem; }
    html.is-mobile .sw-category > h3 {
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }
    html.is-mobile .sw-card .sw-name { font-size: 0.85rem; }
    html.is-mobile .sw-card .sw-desc { font-size: 0.7rem; line-height: 1.3; }
    html.is-mobile .sw-card .sw-platform { font-size: 0.68rem; }
    html.is-mobile .sw-card .sw-actions a,
    html.is-mobile .sw-card .sw-actions button {
      font-size: 0.7rem;
      padding: 0.28rem 0.22rem;
    }
    html.is-mobile .sw-card .sw-desc[style] {
      font-size: 0.68rem !important;
    }

    html.is-mobile #cmd-count,
    html.is-mobile #sw-count,
    html.is-mobile #script-count {
      font-size: 0.78rem;
    }

    html.is-mobile .toast {
      bottom: calc(1rem + env(safe-area-inset-bottom));
      font-size: 0.82rem;
      max-width: 90vw;
      text-align: center;
    }
  </style>
</head>
<body>

<main class="container">

  <header style="margin-bottom:1rem;">
    <h2 style="margin-bottom:0.15rem;">快捷命令</h2>
    <small style="color:var(--pico-muted-color);">命令速查 · 软件链接 · 脚本工具</small>
  </header>

  <div id="loading" class="loading">
    <p>正在加载数据库…</p>
  </div>

  <div id="app" style="display:none;">

    <nav>
      <ul>
        <li><a href="#" id="tab-cmd" class="active" onclick="switchTab('cmd');return false;">命令速查</a></li>
        <li><a href="#" id="tab-sw" onclick="switchTab('sw');return false;">软件链接</a></li>
        <li><a href="#" id="tab-script" onclick="switchTab('script');return false;">脚本工具</a></li>
      </ul>
    </nav>

    <!-- ============ 命令速查 ============ -->
    <section id="section-cmd">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="cmd-keyword" placeholder="输入关键字搜索命令…"
                 oninput="filterCommands()">
        </div>
        <select id="cmd-parent" onchange="onParentChange()">
          <option value="">全部平台</option>
        </select>
        <select id="cmd-child" onchange="filterCommands()">
          <option value="">全部分类</option>
        </select>
        <select id="cmd-shell" onchange="filterCommands()">
          <option value="">全部 Shell</option>
          <option value="CMD">CMD</option>
          <option value="PowerShell">PowerShell</option>
          <option value="Bash">Bash</option>
          <option value="Linux">Linux</option>
          <option value="Windows">Windows</option>
        </select>
        <button class="outline" onclick="resetCmdFilters()" style="padding:0.4rem 0.8rem;font-size:0.85rem;">重置</button>
      </div>

      <div id="cmd-count" style="font-size:0.85rem;color:var(--pico-muted-color);margin-bottom:0.5rem;"></div>

      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table class="cmd-table">
          <thead>
            <tr>
              <th style="width:50px;">ID</th>
              <th>命令</th>
              <th class="hide-mobile" style="min-width:120px;">描述</th>
              <th class="hide-mobile" style="width:90px;">平台</th>
              <th style="width:80px;">分类</th>
              <th style="width:70px;">Shell</th>
              <th style="width:56px;"></th>
            </tr>
          </thead>
          <tbody id="cmd-tbody"></tbody>
        </table>
      </div>
      <div id="cmd-empty" class="empty-tip" style="display:none;">没有匹配的命令</div>
    </section>

    <!-- ============ 软件链接 ============ -->
    <section id="section-sw" style="display:none;">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="sw-keyword" placeholder="搜索软件名 / 描述 / 链接…"
                 oninput="filterSoftware()">
        </div>
        <select id="sw-platform" onchange="filterSoftware()">
          <option value="">全部平台</option>
        </select>
        <button class="outline" onclick="resetSwFilters()" style="padding:0.4rem 0.8rem;font-size:0.85rem;">重置</button>
      </div>

      <div id="sw-count" style="font-size:0.85rem;color:var(--pico-muted-color);margin-bottom:0.8rem;"></div>
      <div id="sw-content"></div>
      <div id="sw-empty" class="empty-tip" style="display:none;">没有匹配的软件</div>
    </section>

    <!-- ============ 脚本工具 ============ -->
    <section id="section-script" style="display:none;">
      <div class="toolbar">
        <div class="search-wrapper">
          <input type="search" id="script-keyword" placeholder="搜索脚本名 / 描述 / 依赖 / 关键字 / 平台…"
                 oninput="filterScripts()">
        </div>
        <select id="script-category" onchange="filterScripts()">
          <option value="">全部分类</option>
        </select>
        <select id="script-type" onchange="filterScripts()">
          <option value="">全部类型</option>
        </select>
        <select id="script-platform" onchange="filterScripts()">
          <option value="">全部平台</option>
        </select>
        <button class="outline" onclick="resetScriptFilters()" style="padding:0.4rem 0.8rem;font-size:0.85rem;">重置</button>
      </div>

      <div id="script-count" style="font-size:0.85rem;color:var(--pico-muted-color);margin-bottom:0.8rem;"></div>
      <div id="script-content"></div>
      <div id="script-empty" class="empty-tip" style="display:none;">没有匹配的脚本</div>
    </section>

  </div>
</main>

<div id="toast" class="toast"></div>

<script>
// ==================== 全局 ====================
let db = null;
let allCommands = [];
let allSoftware = [];
let allScripts = [];

const DB_FILE = 'commands.db';

const IS_MOBILE = document.documentElement.classList.contains('is-mobile');

// ==================== 工具函数 ====================
function $(id) { return document.getElementById(id); }

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('已复制'); }
    catch (e) { showToast('复制失败'); }
    document.body.removeChild(ta);
  }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ==================== 下载脚本 ====================
function downloadScript(id) {
  const script = allScripts.find(s => s.id === id);
  if (!script) return;

  const extMap = {
    'Python':     '.py',
    'PowerShell': '.ps1',
    'bat':        '.bat',
    'vbs':        '.vbs',
    'Shell':      '.sh'
  };
  const ext = extMap[script.script_type] || '.txt';
  const filename = script.name + ext;

  let content = script.content == null ? '' : String(script.content);

  const useCRLF = ['.ps1', '.bat', '.cmd', '.vbs', '.py'].includes(ext);
  content = content.replace(/\r\n|\r|\n/g, useCRLF ? '\r\n' : '\n');

  if (content.charCodeAt(0) === 0xFEFF) {
    content = content.slice(1);
  }

  if (ext === '.ps1') {
    content = '\uFEFF' + content;
  }

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('下载已开始: ' + filename);
}

// ==================== 加载数据库 ====================
async function loadDatabase() {
  try {
    const SQL = await initSqlJs({ locateFile: file => './' + file });

    const resp = await fetch(DB_FILE);
    if (!resp.ok) throw new Error('无法加载 ' + DB_FILE + '（HTTP ' + resp.status + '）');
    const buffer = await resp.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buffer));

    const cmdRes = db.exec(
      "SELECT id, command_text, description, keywords, " +
      "parent_category, child_category, shell FROM command_item " +
      "ORDER BY parent_category, child_category, id"
    );
    allCommands = rowsToObjects(cmdRes, [
      'id','command_text','description','keywords',
      'parent_category','child_category','shell'
    ]);

    const swRes = db.exec(
      "SELECT id, name, url, description, category, platform " +
      "FROM software_item ORDER BY category, platform, name"
    );
    allSoftware = rowsToObjects(swRes, [
      'id','name','url','description','category','platform'
    ]);

    const scriptRes = db.exec(
      "SELECT id, name, category, script_type, content, description, dependencies, keywords, platform " +
      "FROM script_item ORDER BY category, script_type, id"
    );
    allScripts = rowsToObjects(scriptRes, [
      'id','name','category','script_type','content','description','dependencies','keywords','platform'
    ]);

    $('loading').style.display = 'none';
    $('app').style.display = 'block';

    buildCmdFilters();
    renderCommands();
    buildSwFilters();
    renderSoftware();
    buildScriptFilters();
    renderScripts();

  } catch (e) {
    $('loading').innerHTML =
      '<p style="color:#e74c3c;">数据库加载失败</p>' +
      '<p style="font-size:0.85rem;">' + escapeHtml(e.message) + '</p>' +
      '<p style="font-size:0.85rem;">请确认 <code>' + DB_FILE +
      '</code> 和 <code>sql-wasm.wasm</code> 与 HTML 在同一目录，并通过 HTTP 访问（不要直接双击打开 HTML）。</p>';
  }
}

function rowsToObjects(result, fields) {
  if (!result || result.length === 0) return [];
  return result[0].values.map(row => {
    const obj = {};
    fields.forEach((f, i) => { obj[f] = row[i]; });
    return obj;
  });
}

// ==================== Tab 切换 ====================
function switchTab(tab) {
  $('section-cmd').style.display = tab === 'cmd' ? '' : 'none';
  $('section-sw').style.display  = tab === 'sw'  ? '' : 'none';
  $('section-script').style.display = tab === 'script' ? '' : 'none';
  $('tab-cmd').classList.toggle('active', tab === 'cmd');
  $('tab-sw').classList.toggle('active',  tab === 'sw');
  $('tab-script').classList.toggle('active', tab === 'script');
}

// ==================== 命令速查 ====================
function buildCmdFilters() {
  const parents = [...new Set(allCommands.map(c => c.parent_category).filter(Boolean))].sort();
  const childMap = {};
  allCommands.forEach(c => {
    if (!c.parent_category || !c.child_category) return;
    if (!childMap[c.parent_category]) childMap[c.parent_category] = new Set();
    childMap[c.parent_category].add(c.child_category);
  });

  const pSel = $('cmd-parent');
  parents.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    pSel.appendChild(o);
  });

  pSel._childMap = childMap;
}

function onParentChange() {
  const parent = $('cmd-parent').value;
  const childSel = $('cmd-child');
  childSel.innerHTML = '<option value="">全部分类</option>';

  const map = $('cmd-parent')._childMap || {};
  let children = [];
  if (parent) {
    children = map[parent] ? [...map[parent]].sort() : [];
  } else {
    const set = new Set();
    Object.values(map).forEach(s => s.forEach(c => set.add(c)));
    children = [...set].sort();
  }

  children.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    childSel.appendChild(o);
  });

  filterCommands();
}

function filterCommands() {
  const kw     = $('cmd-keyword').value.trim().toLowerCase();
  const parent = $('cmd-parent').value;
  const child  = $('cmd-child').value;
  const shell  = $('cmd-shell').value;

  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allCommands.filter(c => {
    if (parent && c.parent_category !== parent) return false;
    if (child  && c.child_category  !== child)  return false;
    if (shell  && c.shell           !== shell)  return false;

    if (terms.length) {
      const haystack = [
        c.command_text, c.description, c.keywords,
        c.parent_category, c.child_category
      ].join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderCommands(filtered);
}

function renderCommands(list) {
  if (!list) list = allCommands;
  const tbody = $('cmd-tbody');
  tbody.innerHTML = '';

  const empty = $('cmd-empty');
  const count = $('cmd-count');

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 条命令`;

  list.forEach(c => {
    const tr = document.createElement('tr');

    const rawShell = (c.shell || 'CMD').toLowerCase();
    const safeShell = rawShell.replace(/[^a-z0-9]/g, '');
    const shellClass = `shell-${safeShell}`;
    const badgeClass = `badge-shell-${safeShell}`;
    const cmdJsonSafe = JSON.stringify(c.command_text).replace(/"/g, '&quot;');

    if (IS_MOBILE) {
      tr.innerHTML =
        `<td colspan="7" class="m-row">
           <div class="m-cmd-block">
             <div class="cmd-text ${shellClass}">${escapeHtml(c.command_text)}</div>
             <div class="m-desc">${escapeHtml(c.description || '—')}</div>
             <div class="m-meta-row">
               <span class="badge badge-parent">${escapeHtml(c.parent_category || '—')}</span>
               <span class="badge badge-child">${escapeHtml(c.child_category || '—')}</span>
               <span class="badge ${badgeClass}">${escapeHtml(c.shell || 'CMD')}</span>
               <button class="btn-copy outline" onclick="copyText(${cmdJsonSafe})">复制</button>
             </div>
           </div>
         </td>`;
    } else {
      tr.innerHTML =
        `<td>${c.id}</td>` +
        `<td><div class="cmd-text ${shellClass}">${escapeHtml(c.command_text)}</div></td>` +
        `<td class="hide-mobile">${escapeHtml(c.description || '—')}</td>` +
        `<td class="hide-mobile"><span class="badge badge-parent">${escapeHtml(c.parent_category || '—')}</span></td>` +
        `<td><span class="badge badge-child">${escapeHtml(c.child_category || '—')}</span></td>` +
        `<td><span class="badge ${badgeClass}">${escapeHtml(c.shell || 'CMD')}</span></td>` +
        `<td><button class="btn-copy outline" onclick="copyText(${cmdJsonSafe})">复制</button></td>`;
    }

    tbody.appendChild(tr);
  });
}

function resetCmdFilters() {
  $('cmd-keyword').value = '';
  $('cmd-parent').value = '';
  $('cmd-child').innerHTML = '<option value="">全部分类</option>';
  $('cmd-shell').value = '';
  renderCommands();
}

// ==================== 软件链接 ====================
function buildSwFilters() {
  const platforms = [...new Set(allSoftware.map(s => s.platform).filter(Boolean))].sort();
  const sel = $('sw-platform');
  platforms.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
}

function filterSoftware() {
  const kw = $('sw-keyword').value.trim().toLowerCase();
  const platform = $('sw-platform').value;
  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allSoftware.filter(s => {
    if (platform && s.platform !== platform) return false;
    if (terms.length) {
      const haystack = [s.name, s.url, s.description, s.category, s.platform]
        .join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderSoftware(filtered);
}

function renderSoftware(list) {
  if (!list) list = allSoftware;
  const container = $('sw-content');
  const empty = $('sw-empty');
  const count = $('sw-count');
  container.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 个软件`;

  const groups = {};
  list.forEach(s => {
    const cat = s.category || '未分类';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  Object.keys(groups).sort().forEach(cat => {
    const div = document.createElement('div');
    div.className = 'sw-category';
    div.innerHTML = `<h3>${escapeHtml(cat)} <small style="font-weight:400;font-size:0.8rem;">(${groups[cat].length})</small></h3>`;

    const grid = document.createElement('div');
    grid.className = 'sw-grid';

    groups[cat].forEach(s => {
      const card = document.createElement('div');
      card.className = 'sw-card';

      const urlSafe = escapeHtml(s.url);
      const nameSafe = escapeHtml(s.name);

      card.innerHTML =
        `<div class="sw-name">${nameSafe}</div>` +
        (s.platform ? `<div class="sw-platform">${escapeHtml(s.platform)}</div>` : '') +
        (s.description ? `<div class="sw-desc">${escapeHtml(s.description)}</div>` : '') +
        `<div class="sw-actions">` +
        `<a class="sw-btn-open" href="${urlSafe}" target="_blank" rel="noopener">打开</a>` +
        `<button class="sw-btn-copy" onclick="copyText(${JSON.stringify(s.url).replace(/"/g, '&quot;')})">复制</button>` +
        `</div>`;

      grid.appendChild(card);
    });

    div.appendChild(grid);
    container.appendChild(div);
  });
}

function resetSwFilters() {
  $('sw-keyword').value = '';
  $('sw-platform').value = '';
  renderSoftware();
}

// ==================== 脚本工具 ====================
function buildScriptFilters() {
  const cats = [...new Set(allScripts.map(s => s.category).filter(Boolean))].sort();
  const catSel = $('script-category');
  catSel.innerHTML = '<option value="">全部分类</option>';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });

  const types = [...new Set(allScripts.map(s => s.script_type).filter(Boolean))].sort();
  const typeSel = $('script-type');
  typeSel.innerHTML = '<option value="">全部类型</option>';
  types.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    typeSel.appendChild(o);
  });

  const plats = [...new Set(allScripts.map(s => s.platform).filter(Boolean))].sort();
  const platSel = $('script-platform');
  platSel.innerHTML = '<option value="">全部平台</option>';
  plats.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    platSel.appendChild(o);
  });
}

function filterScripts() {
  const kw = $('script-keyword').value.trim().toLowerCase();
  const cat = $('script-category').value;
  const sType = $('script-type').value;
  const platform = $('script-platform').value;
  const terms = kw ? kw.replace(/[；;]/g, ' ').split(/\s+/).filter(Boolean) : [];

  const filtered = allScripts.filter(s => {
    if (cat && s.category !== cat) return false;
    if (sType && s.script_type !== sType) return false;
    if (platform && s.platform !== platform) return false;
    if (terms.length) {
      const haystack = [
        s.name, s.category, s.script_type, s.description,
        s.dependencies, s.keywords, s.platform
      ].join(' ').toLowerCase();
      return terms.every(t => haystack.includes(t));
    }
    return true;
  });

  renderScripts(filtered);
}

function renderScripts(list) {
  if (!list) list = allScripts;
  const container = $('script-content');
  const empty = $('script-empty');
  const count = $('script-count');
  container.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = '';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `共 ${list.length} 个脚本`;

  const groups = {};
  list.forEach(s => {
    const cat = s.category || '未分类';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  Object.keys(groups).sort().forEach(cat => {
    const div = document.createElement('div');
    div.className = 'sw-category';
    div.innerHTML = `<h3>${escapeHtml(cat)} <small style="font-weight:400;font-size:0.8rem;">(${groups[cat].length})</small></h3>`;

    const grid = document.createElement('div');
    grid.className = 'sw-grid';

    groups[cat].forEach(s => {
      const card = document.createElement('div');
      card.className = 'sw-card';

      const safeType = (s.script_type || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const badgeClass = `badge-script-${safeType || 'default'}`;

      let badgeHtml = `<span class="badge ${badgeClass}">${escapeHtml(s.script_type || '未知')}</span>`;
      if (s.platform) {
        badgeHtml += `<span class="badge badge-platform">${escapeHtml(s.platform)}</span>`;
      }

      let depHtml = '';
      if (s.dependencies) {
        const escapedDeps = escapeHtml(s.dependencies);
        const jsonDeps = JSON.stringify(s.dependencies).replace(/"/g, '&quot;');
        depHtml = `
          <div class="sw-desc" style="color: #f59e0b; font-size: 0.75rem; display: flex; align-items: center; justify-content: space-between; margin-top: 0.2rem;">
            <span style="word-break: break-all;">依赖: ${escapedDeps}</span>
            <button class="btn-copy outline" style="padding: 0.1rem 0.4rem; font-size: 0.7rem; margin-left: 0.5rem; white-space: nowrap;" onclick="copyText(${jsonDeps})">复制</button>
          </div>`;
      }

      card.innerHTML =
        `<div class="sw-name">${escapeHtml(s.name)}</div>` +
        `<div style="margin-bottom: 0.2rem;">${badgeHtml}</div>` +
        depHtml +
        (s.description ? `<div class="sw-desc">${escapeHtml(s.description)}</div>` : '') +
        `<div class="sw-actions">` +
        `<button class="sw-btn-download" onclick="downloadScript(${s.id})">下载脚本</button>` +
        `</div>`;

      grid.appendChild(card);
    });

    div.appendChild(grid);
    container.appendChild(div);
  });
}

function resetScriptFilters() {
  $('script-keyword').value = '';
  $('script-category').value = '';
  $('script-type').value = '';
  $('script-platform').value = '';
  renderScripts();
}

// ==================== 启动 ====================
loadDatabase();
</script>
</body>
</html>
